[main]
font=FiraCode Nerd Font Mono:size=12
terminal=alacritty -e

prompt=" "
placeholder=Uygulama ara...

lines=10
width=40

horizontal-pad=20
vertical-pad=12
inner-pad=8

layer=overlay
anchor=center

icons-enabled=yes
use-bold=yes

match-mode=fzf
fields=filename,name,generic,keywords
match-counter=yes
show-actions=yes

[colors]
background=2e3440fa
text=d8dee9ff
prompt=88c0d0ff
placeholder=4c566aff
input=eceff4ff

match=88c0d0ff

selection=434c5eff
selection-text=eceff4ff
selection-match=88c0d0ff

counter=81a1c1ff
border=4c566aff

[border]
width=1
radius=8
selection-radius=6

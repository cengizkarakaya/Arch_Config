"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
scan_timeout = 20

format = """
$directory\
$git_branch\
$git_status\
$rust\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
style = "bold yellow"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
version_format = "${raw}"
style = "bold red"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
